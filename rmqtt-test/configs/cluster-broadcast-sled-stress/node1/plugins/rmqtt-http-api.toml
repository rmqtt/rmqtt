##--------------------------------------------------------------------
## rmqtt-http-api (stress node 1)
##--------------------------------------------------------------------
## Minimal config for the deterministic Forwards-drain wait in
## `session_restart_stress.rs`: the harness polls the Prometheus
## `message_queues.count` gauge on this node until every offline message
## published cross-node is enqueued into the sessions' deliver queues.
##
## - Port 6061: distinct from the harness broker's http-api (6060). The
##   broadcast and raft stress node-1 configs share 6061 because those
##   tests run sequentially (chaos suite, workers = 1) and each kills its
##   own nodes before returning.
## - `prometheus_metrics_cache_interval = "1s"` keeps the gauge fresh
##   enough for 500 ms polling.
## - No `storage` section: history persistence is disabled (the default
##   redb path under /var/log is not writable on all platforms).
##
## See more keys: https://github.com/rmqtt/rmqtt/blob/master/docs/en_US/http-api.md

max_row_limit = 10_000
http_laddr = "0.0.0.0:6061"
http_request_log = false
prometheus_metrics_cache_interval = "1s"
