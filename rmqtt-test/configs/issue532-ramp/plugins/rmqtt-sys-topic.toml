##--------------------------------------------------------------------
## rmqtt-sys-topic (issue #532 ramp fixture)
##--------------------------------------------------------------------
## The stats loop is the point, not the `$SYS` traffic:
## `send_stats` runs `scx.stats.clone(scx).await` every tick, and that
## reaches `HandshakeExecutor::get_rate()` (rmqtt/src/stats.rs ->
## rmqtt/src/executor.rs), the periodic visitor of the same per-port
## handshake executor the ramp saturates. One second is the shortest
## interval the plugin accepts (it clamps anything below 1s), so the
## snapshot fires ~60 times inside one ramp instead of once.
##
## QoS 0 keeps the extra traffic off the queueing path under test.
##
## See more keys: https://github.com/rmqtt/rmqtt/blob/master/docs/en_US/sys-topic.md

publish_qos = 0
publish_interval = "1s"
message_expiry_interval = "1m"
