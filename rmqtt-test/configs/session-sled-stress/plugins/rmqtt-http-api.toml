##--------------------------------------------------------------------
## rmqtt-http-api (standalone stress broker)
##--------------------------------------------------------------------
## Minimal config for the observation read in `session_restart_stress.rs`:
## the standalone stress case reads the `messages.offline.saves.dropped` counter from
## this node's Prometheus endpoint after its 100k-message burst, and reports
## it as a test note (never as a failure).
##
## - Port 6070: belongs to this fixture alone. The harness broker's http-api
##   uses 6060 and the cluster stress node-1 configs use 6061, so nothing
##   else in the suite can collide with it.
## - `prometheus_metrics_cache_interval = "1s"` keeps the counter fresh
##   enough to be read right after the run.
## - No `storage` section: history persistence is disabled (the default
##   redb path under /var/log is not writable on all platforms).
##
## See more keys: https://github.com/rmqtt/rmqtt/blob/master/docs/en_US/http-api.md

max_row_limit = 10_000
http_laddr = "0.0.0.0:6070"
http_request_log = false
prometheus_metrics_cache_interval = "1s"
